name: Instagram sync

on:
  schedule:
    - cron: '0 6 * * *'   # 毎日 15:00 JST（開店前に反映）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Instagram posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/fetch-instagram.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet data/instagram.json; then
            echo "変更なし"; exit 0
          fi
          git config user.name "agayha-bot"
          git config user.email "agayha-bot@users.noreply.github.com"
          git add data/instagram.json
          git commit -m "Instagram投稿を更新"
          git push
